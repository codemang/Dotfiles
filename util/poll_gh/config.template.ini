# poll_gh config. Copy to ~/.config/poll_gh/config.ini (or $XDG_CONFIG_HOME/poll_gh/config.ini)
# and edit. All settings are required. `~` is expanded in paths. Don't quote values:
# quotes would become part of the path.

[poll_gh]

# Path to the gh CLI binary. Find yours with: which gh
# Mac: typically /opt/homebrew/bin/gh
# WSL: typically XXX
gh =

# Path to the Claude Code binary. Find yours with: which claude
# Mac: typically /opt/homebrew/bin/claude
# WSL: typically ~/.npm/bin/claude
claude =

# Skill directory for addressing PR feedback, e.g `~/.claude/skills/address-pr-feedback`
skill_dir =
