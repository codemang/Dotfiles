id = "last-workspace"
name = "Last Workspace"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Jump back to the previously focused workspace (tmux: switch-client -l)"
platforms = ["linux", "macos"]

# Record every workspace focus change so 'toggle' knows where to go back to.
[[events]]
on = "workspace.focused"
command = ["./last-workspace", "record"]

[[actions]]
id = "toggle"
title = "Last workspace"
description = "Focus the previously focused workspace"
contexts = ["global"]
command = ["./last-workspace", "toggle"]
